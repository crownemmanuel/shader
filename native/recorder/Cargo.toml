[package]
name = "shader-recorder"
version = "0.1.4"
edition = "2021"

[features]
default = ["media"]
media = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
gstreamer = { version = "0.24", features = ["v1_22"], optional = true }
gstreamer-app = { version = "0.24", features = ["v1_22"], optional = true }
gstreamer-video = { version = "0.24", features = ["v1_22"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance", "Win32_System_Power", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
